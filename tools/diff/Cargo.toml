[package]
name = "diff"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "diff"
path = "src/main.rs"

[dependencies]
engine-core = { path = "../../crates/engine-core" }
engine-data = { path = "../../crates/engine-data" }
engine-fuzz = { path = "../../crates/engine-fuzz" }
engine-obs = { path = "../../crates/engine-obs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
